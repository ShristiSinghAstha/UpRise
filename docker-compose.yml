


services:
  # ----------------------------------------------------
  # MongoDB Service (Local instance)
  # ----------------------------------------------------
  mongo:
    image: mongo:latest
    container_name: uprise-mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - uprise-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------
  # Backend API Service (Express.js)
  # ----------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: uprise-backend
    restart: unless-stopped
    expose:
      - "5000"
    ports:
      - "5000:5000"  # Exposed for API testing, Nginx will route internally too
    environment:
      - PORT=5000
      - NODE_ENV=production
      # Connect to compose mongo service by default
      - MONGODB_URI=mongodb://mongo:27017/UpRise
      - JWT_SECRET=mySuperSecretKey123
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - uprise-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ----------------------------------------------------
  # Frontend Service (React.js + Client Nginx)
  # ----------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: uprise-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - uprise-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------
  # Nginx Gateway Reverse Proxy (Production router)
  # ----------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: uprise-nginx-router
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - uprise-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------
  # cAdvisor Container Resource Monitor (Host CPU/RAM stats)
  # ----------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: uprise-cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    expose:
      - "8080"
    networks:
      - uprise-network

  # ----------------------------------------------------
  # Prometheus Time-Series Database
  # ----------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: uprise-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend
      - cadvisor
    networks:
      - uprise-network

  # ----------------------------------------------------
  # Grafana Visualization Dashboard
  # ----------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: uprise-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - uprise-network

# Networks for isolation
networks:
  uprise-network:
    driver: bridge

# Volumes for persistence
volumes:
  mongo_data:
  prometheus_data:
  grafana_data:
